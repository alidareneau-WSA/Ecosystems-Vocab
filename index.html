<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ecosystem Connections | Grade 5</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#26362c;background:#f7f7f2}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:22px 16px 60px}header{text-align:center}h1{font-size:clamp(28px,5vw,46px);margin:8px 0 0;letter-spacing:.035em}header p{margin:8px 0 20px;color:#5c675d}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#e5ece2;border-radius:50px;padding:8px 14px;font-weight:700}.progress{height:12px;background:#e2e7dd;border-radius:20px;overflow:hidden;margin:14px 0 18px}.progress>div{height:100%;background:#50845c;transition:width .3s}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}.nav button{border:1px solid #bfcbbc;background:white;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.nav button.active{background:#2e6041;color:white}.nav button.done:after{content:' ✓';color:#61ad69}.nav button.active.done:after{color:white}.game{background:white;border:1px solid #e0e7dd;box-shadow:0 8px 30px #2d4b3010;border-radius:20px;padding:clamp(12px,3vw,28px)}h2{margin:0 0 4px}.hint{color:#65736a;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.tile{min-height:100px;border:2px solid transparent;border-radius:10px;background:#e9e9e2;color:#28362d;font:700 clamp(12px,1.7vw,18px)/1.2 system-ui;cursor:pointer;padding:9px;overflow-wrap:anywhere;transition:background .15s,transform .1s}.tile:hover{filter:brightness(.97)}.tile:focus-visible,button:focus-visible{outline:3px solid #4e83b2;outline-offset:2px}.tile.selected{background:#465f4e;color:white;transform:scale(.98)}.solved{border-radius:12px;padding:13px;text-align:center;margin-bottom:9px;color:#26362c}.solved strong{display:block;font-size:18px;margin-bottom:4px}.solved span{font-size:14px}.c0{background:#f2d98c}.c1{background:#b8d6a9}.c2{background:#a8d2df}.c3{background:#d7c1e7}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}button.action{border:0;border-radius:50px;padding:13px 23px;font-size:16px;font-weight:750;cursor:pointer;background:#2f6042;color:white}button.action.secondary{background:#e6ebe5;color:#26362c}button:disabled{opacity:.45;cursor:not-allowed}.status{text-align:center;min-height:26px;font-weight:700;margin:16px 0 0}.meta{text-align:center;color:#65736a;font-size:14px;margin-top:8px}.teacher{margin-top:22px;border-top:1px solid #e2e8df;padding-top:14px}.teacher summary{cursor:pointer;font-weight:700}.teacher article{margin:12px 0;padding:12px;background:#f4f6f2;border-radius:10px}.teacher article p{margin:5px 0 0}.finish{text-align:center;padding:20px;font-weight:700;font-size:19px}.footer{text-align:center;color:#65736a;font-size:13px;margin-top:18px}@media(max-width:550px){.tile{min-height:92px;font-size:11px;padding:5px}.grid{gap:5px}.nav button{padding:9px}.game{padding:12px}.solved span{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="app"><header><h1>🌿 ECOSYSTEM CONNECTIONS</h1><p>Grade 5 Science • Find four groups of four related clues</p></header><div class="top"><div class="pill" id="progressLabel">0 of 6 games completed</div><button class="action secondary" id="resetAll">Reset all progress</button></div><div class="progress" aria-label="Overall game progress"><div id="progressBar"></div></div><nav class="nav" id="nav" aria-label="Choose game"></nav><section class="game"><h2 id="title"></h2><p class="hint" id="subtitle"></p><div id="solved"></div><div class="grid" id="tiles"></div><div class="status" id="status" aria-live="polite"></div><div class="meta" id="meta"></div><div class="actions"><button class="action secondary" id="deselect">Deselect</button><button class="action" id="submit">Submit four tiles</button><button class="action secondary" id="shuffle">Shuffle remaining</button></div><div class="actions"><button class="action secondary" id="restart">Restart this game</button><button class="action" id="next">Next game →</button></div><details class="teacher"><summary>🔑 Teacher answer key (tap to reveal)</summary><div id="key"></div></details></section><p class="footer">Progress is saved on this device and browser. No student account or internet connection required after opening the file.</p></main><script>
const games=[
{title:'Ecosystem Basics',subtitle:'Vocabulary warm-up • Words only',groups:[['Living things and roles',['Producer','Consumer','Decomposer','Organism'],'Terms for living things and their roles.'],['Bodies of water',['Lake','River','Ocean','Stream'],'Four types of bodies of water.'],['Ecological organization',['Population','Community','Ecosystem','Habitat'],'Terms describing organisms and their environments.'],['Energy concepts',['Energy','Energy transfer','Food chain','Food web'],'How energy moves through ecosystems.']]},
{title:'Guess the Vocabulary',subtitle:'Read carefully • Definitions only',groups:[['Living things and roles',['A single living thing','An organism that eats others','An organism that makes its own food','Breaks down dead organisms'],'Organism, consumer, producer, decomposer.'],['Ecosystem organization',['Living and nonliving things interacting','Members of one species in an area','A place where an organism lives','All populations living together'],'Ecosystem, population, habitat, community.'],['Water environments',['Water flowing toward a larger body','Where a river meets the ocean','A large body of salt water','A body of still water'],'River, estuary, ocean, lake.'],['Other ecosystem concepts',['Anything never alive','Anything alive or once alive','Connected feeding pathways','A sequence showing energy flow'],'Abiotic, biotic, food web, food chain.']]},
{title:'Where Do I Belong?',subtitle:'Identify the examples • Words only',groups:[['Abiotic factors',['Sunlight','Sand','Air','Rock'],'Nonliving things that were never alive.'],['Bodies of water',['River','Lake','Stream','Ocean'],'Water environments.'],['Producers',['Grass','Tree','Algae','Wildflowers'],'Organisms that make their own food.'],['Consumers',['Frog','Hawk','Rabbit','Fox'],'Animals that get energy by eating other organisms.']]},
{title:'Habitat Detectives',subtitle:'Connect environments and their clues',groups:[['Land environments',['Forest','Trees and shade','Grassland','Wide open plains'],'Two terrestrial environments and their descriptions.'],['Ocean and lake',['Ocean','Saltwater waves','Lake','Still freshwater'],'Two aquatic environments and their descriptions.'],['Estuary and river',['Estuary','Fresh and salt water mix','River','Flowing freshwater'],'Two aquatic environments and their descriptions.'],['Broad habitat terms',['Aquatic','A pond','Terrestrial','Dry soil'],'Aquatic and terrestrial terms with related examples.']]},
{title:'Food Chain Connections',subtitle:'Follow the energy • More challenging',groups:[['Producers',['Grass','Algae','Oak tree','Wildflowers'],'Make their own food using sunlight.'],['Consumers',['Fox','Hawk','Rabbit','Snake'],'Eat other organisms for energy.'],['Decomposers',['Fungi','Bacteria','Mushroom','Mold'],'Break down dead material; mushrooms and molds are fungi.'],['Sun and energy',['Sunlight','Energy source','Starts most food chains','Provides light for photosynthesis'],'The sun supplies energy for most food chains.']]},
{title:'Ecosystem Expert',subtitle:'Challenge round • Examples and reasoning',groups:[['Levels of organization',['One deer','All deer in a forest','All plants and animals in a forest','Forest organisms, soil, and sunlight'],'Organism, population, community, ecosystem.'],['Feeding and energy',['A rabbit eats grass','Grass → rabbit → fox','Many connected food chains','Energy moves from prey to predator'],'Feeding relationships and energy transfer.'],['Biotic examples',['A fallen log','A living oak tree','A dead leaf','A mushroom'],'All are living or were once living.'],['Habitats',['A coral reef','A grassy meadow','A wooded hillside','A freshwater pond'],'Places where organisms live.']]}];
const palette=[0,1,2,3];let current=0,selected=[],message='',states=[];
const key='ecosystem-connections-grade5-v1';
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function initial(g){return {solved:[],mistakes:0,order:shuffle(g.groups.flatMap(x=>x[1]))}}
try{let raw=JSON.parse(localStorage.getItem(key));states=Array.isArray(raw)&&raw.length===games.length?raw:games.map(initial)}catch{states=games.map(initial)}
function save(){try{localStorage.setItem(key,JSON.stringify(states))}catch{}}
const $=id=>document.getElementById(id);
function render(){let g=games[current],s=states[current];if(!s||!Array.isArray(s.solved)||!Array.isArray(s.order)){states[current]=initial(g);s=states[current]}
let completed=states.filter(s=>s.solved.length===4).length;$('progressLabel').textContent=`${completed} of 6 games completed`;$('progressBar').style.width=(completed/6*100)+'%';$('nav').innerHTML='';games.forEach((gg,i)=>{let b=document.createElement('button');b.textContent=`Game ${i+1}`;b.className=(i===current?'active ':'')+(states[i].solved.length===4?'done':'');b.onclick=()=>{current=i;selected=[];message='';render()};$('nav').append(b)});
$('title').textContent=`Game ${current+1}: ${g.title}`;$('subtitle').textContent=g.subtitle;$('solved').innerHTML='';s.solved.forEach(gi=>{let group=g.groups[gi],d=document.createElement('div');d.className='solved c'+gi;let a=document.createElement('strong');a.textContent=group[0];let b=document.createElement('span');b.textContent=group[1].join('  •  ');d.append(a,b);$('solved').append(d)});
$('tiles').innerHTML='';let solvedSet=new Set(s.solved.flatMap(i=>g.groups[i][1]));s.order.filter(t=>!solvedSet.has(t)).forEach(t=>{let b=document.createElement('button');b.className='tile'+(selected.includes(t)?' selected':'');b.textContent=t;b.setAttribute('aria-pressed',selected.includes(t)?'true':'false');b.onclick=()=>{if(selected.includes(t))selected=selected.filter(v=>v!==t);else if(selected.length<4)selected.push(t);message='';render()};$('tiles').append(b)});
$('status').textContent=s.solved.length===4?'🎉 Puzzle solved! Excellent ecosystem thinking!':message;$('meta').textContent=`${selected.length} of 4 selected • ${s.solved.length} of 4 groups found • ${s.mistakes} incorrect guesses`;$('submit').disabled=selected.length!==4||s.solved.length===4;$('deselect').disabled=selected.length===0;$('shuffle').disabled=s.solved.length===4;$('next').textContent=current===5?'Back to Game 1 ↻':'Next game →';$('key').innerHTML='';g.groups.forEach((grp,i)=>{let a=document.createElement('article');let h=document.createElement('strong');h.textContent=`${i+1}. ${grp[0]}`;let p=document.createElement('p');p.textContent=grp[1].join(' • ');let q=document.createElement('p');q.textContent=grp[2];a.append(h,p,q);$('key').append(a)});
}
$('submit').onclick=()=>{let g=games[current],s=states[current],gi=g.groups.findIndex(gr=>selected.every(t=>gr[1].includes(t)));if(gi>=0&&!s.solved.includes(gi)){s.solved.push(gi);message=`Correct! ${g.groups[gi][0]}`;selected=[]}else{s.mistakes++;message='Not quite! Try a different connection.';selected=[]}save();render()};
$('deselect').onclick=()=>{selected=[];message='';render()};$('shuffle').onclick=()=>{states[current].order=shuffle(states[current].order);selected=[];render();save()};$('restart').onclick=()=>{if(confirm('Restart this puzzle and clear its progress?')){states[current]=initial(games[current]);selected=[];message='';save();render()}};$('resetAll').onclick=()=>{if(confirm('Reset progress for all six games?')){states=games.map(initial);selected=[];message='';save();render()}};$('next').onclick=()=>{current=(current+1)%games.length;selected=[];message='';render()};render();
</script></body></html>
